<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 502" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD3F7"/><stop offset="1" stop-color="#DDF0FC"/>
    </linearGradient>
  </defs>
  <rect width="1130" height="502" fill="url(#sky)"/>
  <!-- network lines in sky -->
  <g stroke="#FFFFFF" stroke-width="2" opacity=".8" fill="none" stroke-dasharray="6 6">
    <path d="M120 120 L330 70 L560 130 L790 60 L1010 120"/>
    <path d="M330 70 L420 190 M790 60 L700 200"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="120" cy="120" r="7"/><circle cx="330" cy="70" r="7"/><circle cx="560" cy="130" r="7"/>
    <circle cx="790" cy="60" r="7"/><circle cx="1010" cy="120" r="7"/>
  </g>
  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="200" cy="60" rx="50" ry="16"/><ellipse cx="230" cy="50" rx="30" ry="18"/>
    <ellipse cx="900" cy="170" rx="56" ry="16"/><ellipse cx="930" cy="158" rx="30" ry="18"/>
  </g>
  <!-- back skyline: buildings shaped like browser windows -->
  <g fill="#7FB4E3">
    <rect x="0" y="300" width="120" height="202"/><rect x="140" y="250" width="90" height="252"/>
    <rect x="250" y="320" width="130" height="182"/><rect x="400" y="230" width="100" height="272"/>
    <rect x="520" y="290" width="150" height="212"/><rect x="690" y="240" width="110" height="262"/>
    <rect x="820" y="310" width="120" height="192"/><rect x="960" y="260" width="170" height="242"/>
  </g>
  <g fill="#5E98CF">
    <rect x="140" y="250" width="90" height="16"/><rect x="400" y="230" width="100" height="16"/>
    <rect x="690" y="240" width="110" height="16"/><rect x="960" y="260" width="170" height="16"/>
  </g>
  <!-- front street -->
  <g fill="#3E6FA8">
    <rect x="30" y="380" width="160" height="122" rx="6"/><rect x="330" y="360" width="140" height="142" rx="6"/>
    <rect x="610" y="390" width="170" height="112" rx="6"/><rect x="890" y="370" width="150" height="132" rx="6"/>
  </g>
  <g fill="#CDEBFF" opacity=".85">
    <rect x="50" y="400" width="30" height="22" rx="3"/><rect x="95" y="400" width="30" height="22" rx="3"/><rect x="140" y="400" width="30" height="22" rx="3"/>
    <rect x="350" y="380" width="30" height="22" rx="3"/><rect x="420" y="380" width="30" height="22" rx="3"/>
    <rect x="630" y="410" width="30" height="22" rx="3"/><rect x="680" y="410" width="30" height="22" rx="3"/><rect x="730" y="410" width="30" height="22" rx="3"/>
    <rect x="910" y="390" width="30" height="22" rx="3"/><rect x="990" y="390" width="30" height="22" rx="3"/>
  </g>
  <rect y="470" width="1130" height="32" fill="#2C3D66"/>
  <path d="M0 486 H1130" stroke="#F2B632" stroke-width="3" stroke-dasharray="30 22"/>
