:root{
  --outer:#C7D8CE; --bg:#E6EFE9; --panel:#FFFFFF; --panel-2:#F1F6F2; --ink:#12281F; --muted:#4A6257; --line:#C9D8CF;
  --pcb:#17694A; --pcb-deep:#0E4A33; --trace:#B86A22; --led:#FFC21A; --led-glow:rgba(255,194,26,.55);
  --xray:#1D5FA8; --xray-bg:#E3EEFA; --xray-line:rgba(29,95,168,.14); --ok:#1C8A55; --no:#C2412D; --screen:#27506B;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --outer:#07130E; --bg:#0D1E17; --panel:#152C23; --panel-2:#1C392D; --ink:#E4F1EA; --muted:#9BB6A9; --line:#2A4A3D;
    --pcb:#1B7B56; --pcb-deep:#0F4A33; --trace:#E0994F; --xray:#79B0F0; --xray-bg:#12263D; --xray-line:rgba(121,176,240,.16);
    --ok:#43C184; --no:#F07A63; --screen:#1D3F57;
  }
}
:root[data-theme="dark"]{
  --outer:#07130E; --bg:#0D1E17; --panel:#152C23; --panel-2:#1C392D; --ink:#E4F1EA; --muted:#9BB6A9; --line:#2A4A3D;
  --pcb:#1B7B56; --pcb-deep:#0F4A33; --trace:#E0994F; --xray:#79B0F0; --xray-bg:#12263D; --xray-line:rgba(121,176,240,.16);
  --ok:#43C184; --no:#F07A63; --screen:#1D3F57;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.35;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--xray);outline-offset:2px}

/* ---------- frame ---------- */
.viewport{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.frame{position:absolute;left:0;top:0;width:1130px;height:502px;transform-origin:0 0;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{height:58px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;color:#fff;background:var(--pcb-deep);background-image:radial-gradient(circle at 14px 14px,rgba(255,255,255,.09) 2px,transparent 3px);background-size:28px 28px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:#fff;margin-right:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{margin:0;font-size:1.35rem;font-weight:700;line-height:1.05}
.brand p{margin:0;font-size:.78rem;color:#BFE3D2}
.track{display:flex;gap:2px;position:relative}
.track::before{content:"";position:absolute;left:30px;right:30px;top:15px;height:3px;background:var(--trace);border-radius:2px}
.led{position:relative;background:none;border:0;padding:0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#fff;min-width:68px}
.led .bulb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:#0A3625;border:3px solid var(--trace);color:#CFE9DC}
.led.lit .bulb{background:var(--led);color:#3A2A00;box-shadow:0 0 14px var(--led-glow)}
.led.cur .bulb{outline:2px solid #fff;outline-offset:2px}
.led .lbl{font-size:.68rem;color:#D6EEE2;white-space:nowrap}
.mute{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer;flex:none}
.mute svg{width:22px;height:22px}

.body{flex:1;display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.frame.full .body{grid-template-columns:minmax(0,1fr)}
.frame.full .side{display:none}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.task h2{margin:0 0 4px;font-size:1.25rem;line-height:1.15}
.task h2:focus{outline:none}
.task p{margin:0;color:var(--muted);font-size:.88rem}
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:2px solid var(--line);border-left:7px solid var(--trace);border-radius:12px;padding:9px 11px}
.coach svg{width:36px;height:36px;flex:none}
.coach p{margin:0;font-weight:500;font-size:.95rem}
.coach.ok{border-left-color:var(--ok)}
.coach.no{border-left-color:var(--no)}
.tally{margin:auto 0 0;color:var(--muted);font-weight:600;font-size:.9rem}
.play{position:relative;min-height:0;height:420px}
.level{height:100%}
.go{background:var(--pcb);color:#fff;border:0;border-radius:999px;padding:10px 24px;font-size:1.05rem;font-weight:600;cursor:pointer}
.go:hover{filter:brightness(1.1)}

/* ---------- shared drag / tap ---------- */
.tray{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.92rem;background:var(--panel);border:2px solid var(--trace);border-radius:10px;padding:7px 12px;cursor:grab;touch-action:none;user-select:none}
.tag svg{width:22px;height:22px}
.tag.selected{background:var(--trace);color:#fff}
.tag.lifted{opacity:.3}
.ghost{position:fixed;z-index:100;pointer-events:none;margin:0;transform:translate(-50%,-50%) scale(var(--gs,1)) rotate(-3deg);box-shadow:0 12px 26px rgba(0,0,0,.28)}
.hints{list-style:none;padding:0;margin:0;display:grid;gap:6px;align-content:start}
.hints li{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;gap:9px;align-items:flex-start;font-size:.88rem}
.hints b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--pcb);color:#fff;display:grid;place-items:center;font-size:.85rem}
.clues b{background:var(--xray)}
.nope{animation:shake .4s}
@keyframes shake{25%{translate:-7px 0}75%{translate:7px 0}}

/* ---------- level complete overlay ---------- */
.win{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(14,74,51,.55);border-radius:16px}
.win-card{background:var(--panel);border-radius:20px;padding:24px 36px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.3);animation:pop .35s ease-out;max-width:460px}
.win-card h3{margin:10px 0 4px;font-size:1.7rem}
.win-card p{margin:0 0 16px;color:var(--muted)}
.win-card .go{background:var(--led);color:#2D2000}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mini-leds{display:flex;gap:8px;justify-content:center}
.mini-leds span{width:18px;height:18px;border-radius:50%;background:#0A3625;border:2px solid var(--trace)}
.mini-leds span.on{background:var(--led);box-shadow:0 0 10px var(--led-glow);border-color:var(--led)}

/* ---------- intro + badge (full width) ---------- */
.intro{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);gap:44px;align-items:center;padding:0 40px}
.badge-card{background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 30px rgba(14,74,51,.2);rotate:-2deg}
.badge-top{background:var(--pcb);color:#fff;padding:10px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.badge-top i{width:44px;height:10px;border-radius:5px;background:var(--pcb-deep);display:block}
.badge-body{padding:16px;display:grid;gap:8px;justify-items:center;text-align:center}
.badge-body svg{width:96px;height:96px}
.badge-body label{display:grid;gap:4px;width:100%;font-size:.85rem;color:var(--muted)}
.badge-body input{font:inherit;font-size:1.15rem;text-align:center;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--panel-2);color:var(--ink);width:100%}
.role{margin:0;font-weight:600;color:var(--trace)}
.bname{margin:0;font-size:1.45rem;font-weight:700}
.intro h2{font-size:2.6rem;line-height:1.05;margin:0 0 12px}
.intro-text p{max-width:52ch;color:var(--muted);margin:0 0 10px}
.intro-text .go{margin-top:6px}
.learned{margin:0 0 14px;padding-left:1.2em;max-width:62ch;font-size:.95rem}
.learned li{margin-bottom:4px}

/* ---------- Level 1: chip scanner ---------- */
.lab{position:relative;height:100%;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:0 18px;touch-action:none;overflow:hidden;display:flex;align-items:center}
@media (hover:hover){.lab,.lab *{cursor:none}}
.shelf{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.obj{position:relative;overflow:hidden;background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:22px 8px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:box-shadow .3s,opacity .3s}
.obj .ico svg{width:84px;height:84px}
.obj .nm{font-weight:600;font-size:1.05rem}
.obj .res{font-size:.9rem;min-height:1.4em;font-weight:600;display:flex;gap:4px;align-items:center}
.obj .res svg{width:20px;height:20px}
.obj .bar{position:absolute;left:0;bottom:0;height:7px;width:0;background:var(--xray)}
.obj.scanning .bar{width:100%;transition:width .8s linear}
.obj.chip{border-color:var(--led);box-shadow:0 0 0 3px var(--led),0 0 30px var(--led-glow)}
.obj.chip .ico{color:var(--trace)}
.obj.nochip{opacity:.62}
.obj.nochip .res{color:var(--muted)}
.scanner{position:absolute;left:0;top:0;width:84px;height:84px;pointer-events:none;color:var(--xray);z-index:3}
.scanner svg{width:84px;height:84px}

/* ---------- Level 2: desk ---------- */
.l2{display:grid;grid-template-columns:540px minmax(0,1fr);grid-template-rows:auto 1fr;gap:10px 12px;height:100%}
.l2 .scene{grid-column:1;grid-row:1}
.l2 .tray{grid-column:1;grid-row:2}
.l2 .hints{grid-column:2;grid-row:1 / span 2}
.scene{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.hw{fill:var(--panel-2);stroke:var(--ink);stroke-width:3}
.scr{fill:var(--screen)}
.desk{fill:var(--trace);opacity:.55}
.inkline{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.keys{stroke:var(--muted);stroke-width:4;stroke-dasharray:11 5;fill:none}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:42px;height:42px;border-radius:21px;border:3px dashed var(--pcb);background:var(--panel);color:var(--pcb);font-weight:700;font-size:1.05rem;padding:0 10px;cursor:pointer;white-space:nowrap}
.pin.filled{border-style:solid;background:var(--pcb);color:#fff;font-size:.85rem;cursor:default}
.carrying .pin:not(.filled),.pin.hover{box-shadow:0 0 0 5px var(--led-glow)}

/* ---------- Level 3: X-ray ---------- */
.l3{display:grid;grid-template-columns:372px minmax(0,1fr);grid-template-rows:301px 1fr;gap:10px 12px;height:100%}
.l3 .case{grid-column:1;grid-row:1}
.l3 .clues{grid-column:2;grid-row:1}
.l3 .tray{grid-column:1 / span 2;grid-row:2}
.l3 .clues li{font-size:.84rem;padding:5px 8px;line-height:1.25}
.case{position:relative;aspect-ratio:420/340;border:3px solid var(--xray);border-radius:14px;background-color:var(--xray-bg);background-image:linear-gradient(var(--xray-line) 1px,transparent 1px),linear-gradient(90deg,var(--xray-line) 1px,transparent 1px);background-size:20px 20px}
.slot{position:absolute;border:2.5px dashed var(--xray);border-radius:9px;background:transparent;color:var(--xray);font-weight:700;font-size:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;overflow:hidden;cursor:pointer}
.slot[hidden]{display:none}
.slot.mb{z-index:0;justify-content:flex-end;padding-bottom:6px}
.slot.sub{z-index:2}
.slot.sub:not(.filled){border-color:#FFE27A;color:#FFE27A;background:rgba(0,0,0,.2)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--panel);color:var(--ink);cursor:default}
.slot.filled svg{width:auto;height:52%;max-width:70%}
.slot.filled small{font-size:.66rem;font-weight:600;line-height:1.1;text-align:center}
.slot.filled[data-k="psu"],.slot.filled[data-k="hdd"],.slot.filled[data-k="gpu"]{flex-direction:row;gap:6px}
.slot.filled[data-k="gpu"] svg{height:70%}
.slot.mb.filled{background-color:#1E7A50;background-image:linear-gradient(90deg,rgba(255,255,255,.09) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.09) 2px,transparent 2px);background-size:24px 24px;color:#EFFFF6;border-color:#0E4A33}
.carrying .slot:not(.filled),.slot.hover{box-shadow:0 0 0 4px var(--led-glow)}

/* ---------- Level 4: tap the part ---------- */
.l4{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;height:100%}
.device-wrap{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:grid;place-items:center;min-height:0}
.device{display:block;width:100%;max-height:380px}
.device-wrap.phone .device{height:384px;width:auto}
.kb,.pad{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.lens,.port{fill:var(--ink)}
.btn{fill:var(--muted)}
.dots{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;fill:none}
.hit{fill:transparent;stroke:transparent;stroke-width:3}
.hot{cursor:pointer;outline:none}
.hot:hover .hit{fill:rgba(29,95,168,.12)}
.hot:focus-visible .hit{stroke:var(--xray);stroke-dasharray:6 4}
.hot.found .hit{fill:var(--led-glow);stroke:var(--led)}
.hot.miss .hit{fill:rgba(194,65,45,.3)}
.riddle{background:var(--panel);border:2px solid var(--line);border-left:7px solid var(--led);border-radius:14px;padding:14px 16px}
.riddle .rn{margin:0 0 6px;color:var(--muted);font-size:.9rem}
.riddle .rq{margin:0;font-size:1.3rem;font-weight:500;line-height:1.3}
.found{color:var(--muted);margin:12px 0 0;font-size:.95rem}

/* ---------- Level 5: sorting belt ---------- */
.l5{display:flex;flex-direction:column;gap:14px;height:100%}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bin{--c:var(--xray);background:var(--panel);border:3px solid var(--c);border-top-width:10px;border-radius:10px 10px 22px 22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;cursor:pointer}
.bin.output{--c:var(--trace)}
.bin.network{--c:var(--pcb)}
.bin strong{font-size:1.3rem;color:var(--c)}
.bin span{font-size:.88rem;color:var(--muted);line-height:1.25}
.bin em{font-style:normal;font-weight:700;font-size:1.1rem;margin-top:4px}
.bin.hover{box-shadow:0 0 0 5px var(--led-glow)}
.bin.good{box-shadow:0 0 0 5px var(--ok)}
.belt{position:relative;flex:1;overflow:hidden;background:var(--panel);border:2px solid var(--line);border-radius:16px}
.belt::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:28px;border-radius:14px;background:repeating-linear-gradient(90deg,#5B6D65 0 18px,#7E918A 18px 36px);animation:roll 1s linear infinite}
@keyframes roll{to{background-position:36px 0}}
.parcel{position:absolute;bottom:52px;left:-10rem;width:9.5rem;padding:10px;background:var(--panel-2);border:2px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;cursor:grab;touch-action:none;user-select:none;animation:ride 12s linear infinite;z-index:1}
.parcel svg{width:64px;height:64px}
.parcel.paused{animation-play-state:paused;border-color:var(--led)}
@keyframes ride{from{left:-10rem}to{left:100%}}
.belt .empty{position:absolute;inset:0 0 60px;display:grid;place-items:center;margin:0;font-weight:600;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .parcel{animation:none;left:calc(50% - 4.75rem)}
  .belt::after,.nope,.win-card{animation:none}
  .obj.scanning .bar{transition:none;width:100%}
}
</style>
</head>

/* Inside the Machine | audio.js
   Sound effects. Files live in assets/audio/ (MP3 for the game, WAV masters in assets/audio/wav/).
   The single-file build sets window.SFX_DATA with embedded copies instead. */
const SFX={
  tap:{file:'tap',vol:.45},              // buttons, level track, tapping a device part
  pickup:{file:'pickup',vol:.55},        // picking up / selecting a label, part or device
  drop:{file:'drop',vol:.7},             // any drop onto a target (right or wrong)
  correct:{file:'correct',vol:.8},       // right answer
  wrong:{file:'wrong',vol:.65},          // wrong answer (gentle)
  scan:{file:'scan',vol:.45},            // Level 1 scanner sweep (0.8 s = scan time)
  noChip:{file:'no-chip',vol:.55},       // Level 1 object without a chip
  reveal:{file:'reveal',vol:.6},         // new spaces appear / next device arrives
  levelComplete:{file:'level-complete',vol:.85},
  allComplete:{file:'all-complete',vol:.9}
};
const Sound=(()=>{
  const base={};
  for(const [k,v] of Object.entries(SFX)){
    const src=(window.SFX_DATA&&window.SFX_DATA[v.file])||`assets/audio/${v.file}.mp3`;
    const a=new Audio(src); a.preload='auto'; base[k]=a;
  }
  function play(k,delay=0){
    if(!store.sound||!base[k])return null;
    const a=base[k].cloneNode(); a.volume=SFX[k].vol;
    const go=()=>{a.play().catch(()=>{})};
    delay?setTimeout(go,delay):go();
    return a;
  }
  function stop(a){if(a){a.pause();a.currentTime=0}}
  function result(ok){play(ok?'correct':'wrong',90)}   // after the drop sound
  return {play,stop,result};
})();

/* Inside the Machine | engine.js
   Frame scaling, screen switching, LED level track, side panel, coach messages,
   level-complete overlay, sound toggle and the drag-or-tap helper. */
const W=1130, H=502;
const frame=$('#frame'), stage=$('#stage'), track=$('#track'), coach=$('#coach'), sayEl=$('#say'), taskEl=$('#task'), tallyEl=$('#tally'), muteBtn=$('#mute');
let current=0, ctl=null, SCALE=1;

/* ---------- fixed 1130 x 502 frame, scaled to fit ---------- */
function fit(){
  const vp=frame.parentElement, cw=vp.clientWidth, ch=vp.clientHeight;
  SCALE=Math.min(cw/W,ch/H);
  frame.style.transform=`translate(${(cw-W*SCALE)/2}px,${(ch-H*SCALE)/2}px) scale(${SCALE})`;
  document.documentElement.style.setProperty('--gs',SCALE);
}
addEventListener('resize',fit); fit();

/* ---------- side panel + coach ---------- */
function say(t,mood=''){sayEl.textContent=t;coach.className='coach '+mood}
function setTask(title,text){taskEl.innerHTML=`<h2 tabindex="-1">${title}</h2><p>${text}</p>`}
function setTally(t){tallyEl.textContent=t}
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),600)}

/* ---------- sound toggle ---------- */
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function renderMute(){muteBtn.innerHTML=store.sound?SPK_ON:SPK_OFF;muteBtn.setAttribute('aria-pressed',String(!store.sound));muteBtn.setAttribute('aria-label',store.sound?'Sound on. Turn sound off':'Sound off. Turn sound on')}
muteBtn.addEventListener('click',()=>{store.sound=!store.sound;save();renderMute();Sound.play('tap')});
renderMute();

/* ---------- navigation ---------- */
function renderTrack(){
  track.innerHTML=LEVELS.map((L,i)=>{const n=i+1,done=store.done.includes(n),cur=current===n;
    return `<button type="button" class="led${done?' lit':''}${cur?' cur':''}" data-go="${n}" aria-label="Level ${n}: ${L.short}${done?', complete':''}"${cur?' aria-current="step"':''}><span class="bulb">${n}</span><span class="lbl">${L.short}</span></button>`}).join('');
}
function go(n){
  if(ctl)ctl.abort(); ctl=new AbortController(); current=n; renderTrack();
  const sig=ctl.signal;
  frame.classList.toggle('full',n===0||n===6);
  setTally('');
  if(n===0)intro(sig); else if(n===6)badge(sig); else LEVELS[n-1].render(sig);
  const h=$('h2',taskEl); if(h&&n>0&&n<6)h.focus({preventScroll:true});
}
function complete(n){
  if(!store.done.includes(n)){store.done.push(n);save()}
  renderTrack();
  const all=LEVELS.every((_,i)=>store.done.includes(i+1));
  // Next button always moves forward one level; after level 5 it goes to the badge
  // if every level is done, otherwise back to the first level still to finish.
  const target=all?6:(n<5?n+1:LEVELS.map((_,i)=>i+1).find(k=>!store.done.includes(k)));
  const win=document.createElement('div'); win.className='win';
  win.innerHTML=`<div class="win-card" role="dialog" aria-label="${all?'All levels complete':'Level '+n+' complete'}">
    <div class="mini-leds">${LEVELS.map((_,i)=>`<span class="${store.done.includes(i+1)?'on':''}"></span>`).join('')}</div>
    <h3>${all?'All 5 levels complete!':'Level '+n+' complete!'}</h3>
    <p>${all?'You have finished every job in the lab. Time to collect your technician badge.':`${store.done.length} of 5 levels done. Keep going, technician!`}</p>
    <button class="go" type="button">${all?'Get your technician badge':'Go to level '+target}</button></div>`;
  setTimeout(()=>{
    if(!stage.contains($('.level',stage)))return;
    $('.level',stage).appendChild(win);
    Sound.play(all?'allComplete':'levelComplete');
    const b=$('button',win); b.onclick=()=>{Sound.play('tap');go(target)}; b.focus({preventScroll:true});
  },900);
}
track.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){Sound.play('tap');go(+b.dataset.go)}});
$('#home').addEventListener('click',()=>{Sound.play('tap');go(0)});

/* ---------- drag OR tap-then-tap (mouse, touch, keyboard) ---------- */
function dragTap({root,items,targets,onDrop,signal}){
  let selected=null,drag=null,lastDrag=0;
  const clear=()=>{if(selected)selected.classList.remove('selected');selected=null;root.classList.remove('carrying')};
  const drop=(it,tg)=>{Sound.play('drop');onDrop(it,tg)};
  root.addEventListener('click',e=>{
    if(Date.now()-lastDrag<350)return;
    const it=e.target.closest(items);
    if(it){const same=selected===it;clear();if(!same){selected=it;it.classList.add('selected');root.classList.add('carrying');Sound.play('pickup')}return}
    const tg=e.target.closest(targets);
    if(tg&&selected){const s=selected;clear();drop(s,tg)}
  },{signal});
  root.addEventListener('pointerdown',e=>{
    const it=e.target.closest(items); if(!it||e.button>0)return;
    drag={it,x:e.clientX,y:e.clientY,ghost:null,over:null};
  },{signal});
  addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.ghost){
      if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
      clear(); Sound.play('pickup');
      const g=drag.it.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g);
      drag.ghost=g; drag.it.classList.add('lifted'); root.classList.add('carrying');
    }
    drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY), tg=el&&el.closest(targets);
    if(drag.over!==tg){drag.over&&drag.over.classList.remove('hover');tg&&tg.classList.add('hover');drag.over=tg}
  },{signal});
  const end=cancel=>()=>{
    if(!drag)return; const d=drag; drag=null;
    if(!d.ghost)return;
    d.ghost.remove(); d.it.classList.remove('lifted'); root.classList.remove('carrying');
    d.over&&d.over.classList.remove('hover'); lastDrag=Date.now();
    if(!cancel&&d.over)drop(d.it,d.over);
  };
  addEventListener('pointerup',end(false),{signal});
  addEventListener('pointercancel',end(true),{signal});
}

/* Inside the Machine | levels/level1-chip-scanner.js
   Sweep the scanner over objects; anything with a computer chip lights up.
   Sounds: scan (while scanning), correct (chip found), noChip (no chip). */
function lvl1(sig){
  const objs=shuffle(L1);
  setTask('Level 1: Chip scanner','Move the blue scanner over each object and hold it still. Anything with a computer chip inside will light up. You can also tap an object to scan it.');
  stage.innerHTML=`<section class="level">
    <div class="lab" id="lab"><div class="shelf">${objs.map((o,i)=>`<button type="button" class="obj" data-i="${i}" aria-label="Scan the ${o.name.toLowerCase()}"><span class="ico">${ico(o.k)}</span><span class="nm">${o.name}</span><span class="res"></span><span class="bar"></span></button>`).join('')}</div>
      <div class="scanner" id="scanner">${SCANNER}</div></div></section>`;
  say('Some of these objects are secretly computers. Use the scanner to find the computer chips.');
  const lab=$('#lab'), sc=$('#scanner'); let cur=null,timer=null,hum=null,count=0;
  setTally(`Scanned 0 of ${objs.length}`);
  const place=(x,y)=>{sc.style.transform=`translate(${x-34}px,${y-34}px)`};
  place(lab.clientWidth-70,lab.clientHeight-50);
  const stop=()=>{clearTimeout(timer);Sound.stop(hum);hum=null;if(cur)cur.classList.remove('scanning');cur=null};
  sig.addEventListener('abort',stop);
  lab.addEventListener('pointermove',e=>{
    const r=lab.getBoundingClientRect(); place((e.clientX-r.left)/SCALE,(e.clientY-r.top)/SCALE);
    const el=document.elementFromPoint(e.clientX,e.clientY), o=el&&el.closest('.obj');
    if(o===cur)return; stop();
    if(o&&!o.classList.contains('scanned')){cur=o;o.classList.add('scanning');hum=Sound.play('scan');timer=setTimeout(()=>{hum=null;stop();reveal(o)},800)}
  },{signal:sig});
  lab.addEventListener('pointerleave',stop,{signal:sig});
  lab.addEventListener('click',e=>{const o=e.target.closest('.obj');if(o&&!o.classList.contains('scanned')){stop();reveal(o)}},{signal:sig});
  function reveal(o){
    const d=objs[+o.dataset.i];
    o.classList.add('scanned',d.chip?'chip':'nochip');
    $('.res',o).innerHTML=d.chip?`${CHIP} Chip found`:'No chip';
    o.setAttribute('aria-label',`${d.name}: ${d.chip?'computer chip found':'no chip'}`);
    Sound.play(d.chip?'correct':'noChip');
    count++; setTally(`Scanned ${count} of ${objs.length}`);
    say(d.msg,d.chip?'ok':'');
    if(count===objs.length)setTimeout(()=>{if(sig.aborted)return;
      say('Scan complete! The tablet, smartwatch and phone all have computer chips. Surprise: phones and tablets are computers too!','ok');complete(1)},900);
  }
}

/* Inside the Machine | levels/level2-desk-setup.js
   Drag labels onto the numbered parts of a desktop setup using the hint cards.
   Sounds: pickup, drop, correct / wrong. */
function lvl2(sig){
  setTask('Level 2: Set up the desk','A new computer has arrived. Read the numbered hint cards, then drag each label onto the matching number. You can also tap a label, then tap a number.');
  stage.innerHTML=`<section class="level l2">
      <div class="scene">${DESK}${L2.map(p=>`<button type="button" class="pin" data-n="${p.n}" style="left:${p.x}%;top:${p.y}%" aria-label="Spot ${p.n}">${p.n}</button>`).join('')}</div>
      <div class="tray">${shuffle(L2).map(p=>`<button type="button" class="tag" data-label="${p.label}">${p.label}</button>`).join('')}</div>
      <ol class="hints">${L2.map(p=>`<li><b>${p.n}</b><span>${p.hint}</span></li>`).join('')}</ol>
    </section>`;
  say('Every part has a number. Read the hint card with the same number to work out its name.');
  let placed=0; setTally(`Labels placed: 0 of ${L2.length}`);
  dragTap({root:$('.level',stage),items:'.tag',targets:'.pin:not(.filled)',signal:sig,onDrop(tag,pin){
    const p=L2.find(q=>q.n==pin.dataset.n), ok=tag.dataset.label===p.label;
    Sound.result(ok);
    if(ok){
      pin.classList.add('filled');pin.textContent=p.label;pin.disabled=true;pin.setAttribute('aria-label',`Spot ${p.n}: ${p.label}`);
      tag.remove();placed++;setTally(`Labels placed: ${placed} of ${L2.length}`);say(`Yes! Number ${p.n} is the ${p.label.toLowerCase()}.`,'ok');
      if(placed===L2.length){say('The desk is set up and ready to switch on. Great work!','ok');complete(2)}
    }else{flash(pin,'nope');say(`Not quite. Read hint card ${p.n} again. Does it sound like the ${tag.dataset.label.toLowerCase()}?`,'no')}
  }});
}

/* Inside the Machine | levels/level3-xray.js
   X-ray view of the system unit: drag parts into lettered spaces using the clue cards.
   RAM, fan and graphics card spaces appear only after the motherboard is in.
   Sounds: pickup, drop, correct / wrong, reveal (new spaces appear). */
function lvl3(sig){
  setTask('Level 3: X-ray the system unit','This is an X-ray view inside the system unit. Each empty space has a letter. Read the clue card with that letter, then drag the right part into the space.');
  stage.innerHTML=`<section class="level l3">
      <div class="case">${L3.map(p=>`<button type="button" class="slot${p.k==='mb'?' mb':''}${p.sub?' sub':''}" data-k="${p.k}" style="left:${(p.x/4.2).toFixed(2)}%;top:${(p.y/3.4).toFixed(2)}%;width:${(p.w/4.2).toFixed(2)}%;height:${(p.h/3.4).toFixed(2)}%"${p.sub?' hidden':''} aria-label="Space ${p.letter}">${p.letter}</button>`).join('')}</div>
      <ol class="hints clues">${L3.map(p=>`<li><b>${p.letter}</b><span>${p.clue}</span></li>`).join('')}</ol>
      <div class="tray">${shuffle(L3).map(p=>`<button type="button" class="tag" data-k="${p.k}">${ico(p.k)}${p.name}</button>`).join('')}</div>
    </section>`;
  say('Some spaces stay hidden until one big part goes in. Can you work out which part?');
  let placed=0, mbIn=false; setTally(`Parts fitted: 0 of ${L3.length}`);
  dragTap({root:$('.level',stage),items:'.tag',targets:'.slot:not(.filled)',signal:sig,onDrop(tag,slot){
    const part=L3.find(p=>p.k===tag.dataset.k), sp=L3.find(p=>p.k===slot.dataset.k), ok=part.k===sp.k;
    Sound.result(ok);
    if(ok){
      slot.classList.add('filled');slot.disabled=true;slot.setAttribute('aria-label',`Space ${sp.letter}: ${part.short}`);
      slot.innerHTML=part.k==='mb'?`<small>${part.short}</small>`:`${ico(part.k)}<small>${part.short}</small>`;
      tag.remove();placed++;setTally(`Parts fitted: ${placed} of ${L3.length}`);
      if(part.k==='mb'){mbIn=true;$$('.slot.sub',stage).forEach(s=>s.hidden=false);Sound.play('reveal',500)}
      say(part.yay,'ok');
      if(placed===L3.length){say('The system unit is complete. You built the inside of a computer!','ok');complete(3)}
    }else if(part.sub&&sp.k==='mb'&&!mbIn){flash(slot,'nope');say(`The ${part.short.toLowerCase()} plugs into the motherboard. Put the motherboard in first!`,'no')}
    else{flash(slot,'nope');say(`That part does not match clue ${sp.letter}. Read clue ${sp.letter} again.`,'no')}
  }});
}

/* Inside the Machine | levels/level4-tap-the-part.js
   Riddles on a laptop, then a phone: tap the part each riddle describes.
   Sounds: tap, correct / wrong, reveal (phone arrives). */
function lvl4(sig){
  let d=0,r=0,busy=false,found=[];
  setTask('Level 4: Tap the part','Read each riddle, then tap the part of the device it describes. First a laptop, then a phone.');
  stage.innerHTML=`<section class="level l4"><div class="device-wrap" id="dev"></div>
      <div><div class="riddle"><p class="rn" id="rn"></p><p class="rq" id="rq"></p></div><p class="found" id="found"></p></div></section>`;
  const dev=$('#dev'), total=DEVICES.reduce((a,D)=>a+D.riddles.length,0); let solved=0;
  function load(){const D=DEVICES[d];dev.innerHTML=D.svg;dev.className='device-wrap '+D.title;found=[];$('#found').textContent='';ask();busy=false}
  function ask(){const D=DEVICES[d];$('#rn').textContent=`${cap(D.title)}: riddle ${r+1} of ${D.riddles.length}`;$('#rq').textContent=D.riddles[r].q}
  function pick(h){
    const D=DEVICES[d], part=h.dataset.part, want=D.riddles[r].part;
    Sound.play('tap');
    if(part!==want){Sound.result(false);flash(h,'miss');say(`That is the ${D.names[part]}. Read the riddle again and try another part.`,'no');return}
    Sound.result(true);
    h.classList.add('found'); found.push(D.names[part]); $('#found').textContent='Found: '+found.join(', ');
    solved++; setTally(`Riddles solved: ${solved} of ${total}`);
    say(`Yes! That is the ${D.names[part]}.`,'ok'); r++;
    if(r<D.riddles.length){ask();return}
    busy=true;
    if(d===0){say('Laptop done! Now let us look at a phone.','ok');
      setTimeout(()=>{if(sig.aborted)return;d=1;r=0;load();Sound.play('reveal')},1500)}
    else{$('#rn').textContent='All riddles solved';$('#rq').textContent='You know the parts of a laptop and a phone.';complete(4)}
  }
  dev.addEventListener('click',e=>{const h=e.target.closest('.hot');if(h&&!busy)pick(h)},{signal:sig});
  dev.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const h=e.target.closest('.hot');if(h&&!busy){e.preventDefault();pick(h)}}},{signal:sig});
  load(); setTally(`Riddles solved: 0 of ${total}`);
  say('Riddle time! Each riddle describes one part. Tap the part you think it is.');
}

/* Inside the Machine | levels/level5-sorting-belt.js
   Devices ride a conveyor belt; sort each into Input, Output or Networking.
   Sounds: pickup, drop, correct / wrong. */
function lvl5(sig){
  const queue=shuffle(L5); let i=0, drag=null, lastDrag=0; const counts={input:0,output:0,network:0};
  setTask('Level 5: Sorting belt','Devices are riding the belt. Drag each one into the right bin, or tap the bin while the device is on the belt.');
  stage.innerHTML=`<section class="level l5">
    <div class="bins">${CATS.map(c=>`<button type="button" class="bin ${c.k}" data-cat="${c.k}"><strong>${c.name}</strong><span>${c.desc}</span><em data-c="${c.k}">0</em></button>`).join('')}</div>
    <div class="belt" id="belt"></div></section>`;
  const belt=$('#belt');
  function next(){
    if(i>=queue.length){belt.innerHTML='<p class="empty">The belt is empty. Every device is sorted!</p>';setTally(`Sorted ${queue.length} of ${queue.length}`);
      say('Brilliant sorting! Input puts information in, output gives it out, and networking connects computers together.','ok');complete(5);return}
    const it=queue[i];
    belt.innerHTML=`<div class="parcel" id="parcel" role="img" aria-label="On the belt: ${it.name}">${ico(it.k)}<span>${it.name}</span></div>`;
    setTally(`Device ${i+1} of ${queue.length}`);
  }
  function sortTo(cat,bin){
    const it=queue[i]; if(!it)return;
    Sound.play('drop'); Sound.result(it.cat===cat);
    if(it.cat===cat){counts[cat]++;$(`[data-c="${cat}"]`,stage).textContent=counts[cat];flash(bin,'good');say(`Yes! ${it.name}: ${it.why}`,'ok');i++;next()}
    else{flash(bin,'nope');say(`Not quite. ${it.name}: ${it.why} Which bin fits that?`,'no')}
  }
  $$('.bin',stage).forEach(b=>b.addEventListener('click',()=>{if(Date.now()-lastDrag<350)return;sortTo(b.dataset.cat,b)},{signal:sig}));
  belt.addEventListener('pointerdown',e=>{
    const p=e.target.closest('.parcel'); if(!p||e.button>0)return;
    p.classList.add('paused'); drag={p,x:e.clientX,y:e.clientY,ghost:null,over:null};
  },{signal:sig});
  addEventListener('pointermove',e=>{
    if(!drag)return;
    if(!drag.ghost){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
      Sound.play('pickup');
      const g=drag.p.cloneNode(true);g.classList.add('ghost');g.style.animation='none';g.style.bottom='auto';document.body.appendChild(g);drag.ghost=g;drag.p.style.visibility='hidden'}
    drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY), b=el&&el.closest('.bin');
    if(drag.over!==b){drag.over&&drag.over.classList.remove('hover');b&&b.classList.add('hover');drag.over=b}
  },{signal:sig});
  const end=()=>{
    if(!drag)return; const d=drag; drag=null;
    if(!d.ghost){Sound.play('pickup');say('Belt paused. Tap the bin where this device belongs.');return}
    d.ghost.remove(); d.p.style.visibility=''; d.over&&d.over.classList.remove('hover'); lastDrag=Date.now();
    if(d.over)sortTo(d.over.dataset.cat,d.over);
    if(d.p.isConnected)d.p.classList.remove('paused');
  };
  addEventListener('pointerup',end,{signal:sig});
  addEventListener('pointercancel',end,{signal:sig});
  next();
  say('Input devices put information in. Output devices give it out. Networking devices connect computers together.');
}

/* Inside the Machine | levels/badge.js
   Completion certificate (reached after all 5 levels; the all-complete fanfare plays on the overlay before this). */
function badge(sig){
  const nm=store.name.trim()||'Technician';
  stage.innerHTML=`<section class="level"><div class="intro">
    <div class="badge-card"><div class="badge-top"><span>ICT360 Computer Lab</span><i></i></div>
      <div class="badge-body">${AVATAR}<p class="bname">${esc(nm)}</p><p class="role">Certified computer technician</p><div class="mini-leds">${LEVELS.map(()=>'<span class="on"></span>').join('')}</div></div></div>
    <div class="intro-text"><h2>Congratulations, ${esc(nm)}!</h2><p>You earned your badge. Today you found out that:</p>
      <ul class="learned">
        <li>Phones, tablets and smartwatches are computers because they have computer chips inside.</li>
        <li>A desktop computer has a monitor, system unit, keyboard, mouse and speakers.</li>
        <li>Inside the system unit are the motherboard, RAM, power supply, hard disk, cooling fan and graphics card.</li>
        <li>Laptops and phones have parts like a webcam, touchpad, charging port and microphone.</li>
        <li>Devices can be sorted into input, output and networking.</li>
      </ul>
      <button class="go" type="button" id="again">Play again</button></div>
  </div></section>`;
  Sound.play('reveal');
  $('#again').addEventListener('click',()=>{Sound.play('tap');store.done=[];save();go(1)},{signal:sig});
}

/* Inside the Machine | main.js
   Starts the game on the title screen. */
go(0);

})();
